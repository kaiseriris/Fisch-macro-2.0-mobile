
name: Build Fisch Macro APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract 2.0 source
        shell: bash
        run: |
          mkdir -p project
          unzip -q FischMobileMacro_Source.zip -d project

          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "No Gradle project found in ZIP"
            find project -maxdepth 4 -print | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          if [ -x "$PROJECT_DIR/gradlew" ]; then
            bash "$PROJECT_DIR/gradlew" \
              -p "$PROJECT_DIR" \
              --no-daemon assembleDebug
          else
            gradle -p "$PROJECT_DIR" \
              --no-daemon assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FischMacro-2.0-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v2.0.${{ github.run_number }}
          commit: ${{ github.sha }}
          name: Fisch Macro 2.0 - Build ${{ github.run_number }}
          body: |
            Fisch Macro 2.0 Android APK

            Automatically built using GitHub Actions.
          artifacts: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          makeLatest: true
